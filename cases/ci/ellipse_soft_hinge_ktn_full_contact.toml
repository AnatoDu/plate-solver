# CI: эллипс, ШАРНИРНОЕ опирание, КОНТАКТ по полной КТН (v0.6.3).
# Полное покрытие: контакт по КТН на мягком шарнире эллиптической пластины,
# лицевое условие Синьорини u_c = w + (h_c²−h_*²)Δw. Сильное мембранное
# ужесточение шарнира ⇒ gain = "linear" (гарантия сжатия теоремы 4).
[geometry]
kind = "ellipse"
a = 1.5
b = 1.0

[bc]
type = "soft_hinge"

[load]
type = "uniform"
q0 = 0.01

[model]
theory = "ktn_full"
h = 0.2
n_load_steps = 2
karman_max_iter = 80
karman_tol = 1.0e-6

[contact]
enabled = true
gap_factor = 0.5
scheme = "merged"
gain = "linear"           # мягкий шарнир: верхняя грань ‖G‖ (сходимость гарантирована)
beta = 1.5
max_iter = 1500
tol = 3.0e-4

[discretization]
p = 6
Q = 48
grid_n = 16

[verify]
reference = "none"        # ворота-инварианты (r≥0, комплементарность, зона)

[output]
dir = "results/ci/ellipse_soft_hinge_ktn_full_contact"
