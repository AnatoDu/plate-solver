# CI комплекса программ: стиль + быстрые тест-ворота.
# Тяжёлые квадратуры (-m big) и МКЭ-верификация (-m fem) гоняются локально:
# см. pyproject [tool.pytest.ini_options] markers. Секретов нет — только публичное.
name: ci

# Только чтение: заданиям CI ничего писать не нужно (стиль и тесты).
permissions:
  contents: read

on:
  push:
    # ветки волн аудита тоже гоняются: красноту надо видеть ДО слияния в main,
    # иначе первый прогон новых ног матрицы приходится на сам выкат
    branches: [main, 'audit-*']
  pull_request:
  # кнопка «Run workflow» на ЛЮБОЙ ветке: прогнать матрицу до слияния,
  # не открывая PR
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон (матрица из четырёх ног
# по часу — экономия и очереди, и минут).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # классификаторы pyproject обещают 3.11–3.14 ⇒ матрица их и гоняет
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка (editable + dev)
        run: pip install -e ".[dev]"
      - name: Стиль (ruff)
        run: ruff check .
      - name: Тесты (без big и fem)
        # без -q: в pyproject addopts уже есть -q, второй ключ даёт -qq и
        # съедает итоговую строку «N passed» — в логе CI её нужно видеть
        run: pytest -m "not big and not fem"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Сборка sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Установка из sdist + смок
        run: |
          pip install dist/*.tar.gz
          python -c "import plate_solver; print(plate_solver.__version__)"
          # смок ВСЕХ пяти команд (раньше проверялась только plate-solve)
          plate-solve --version && plate-verify --version && plate-ladder --version
          plate-replot --version && plate-profile --version
          plate-solve --new circle && test -f circle.toml
          plate-solve circle.toml --check
          plate-verify --help > /dev/null
