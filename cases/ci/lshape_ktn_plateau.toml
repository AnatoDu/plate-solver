# CI: ПЛОЩАДНОЙ режим контакта — плато реакции r ≈ q0 на неканонической форме.
#
# При МАЛОМ зазоре (Δ = 0.002·w_free) пластина почти целиком ложится на
# основание: реакция в глубине зоны выходит на плато r ≈ q0 (нагрузка
# передаётся основанию напрямую), кромочная сингулярность остаётся узкой
# полосой, зона односвязна. Это физический контроль контактного тракта на
# области с входящим углом — картина известна для круга и здесь
# воспроизводится на L-форме.
#
# Уточнённая теория здесь ОБЯЗАТЕЛЬНА для сходимости: член податливости
# −κ_r·r делает задачу дополнительности строго монотонной (NOTES §11), и МОР
# сходится за ~8000 итераций; классическая итерация при таком зазоре лишь
# «полусходится». Ворота — tests/test_lshape_plateau.py (плато, топология,
# доля переданной силы) плюс автоматические инварианты контакта
# (r ≥ 0, проникание, существование зоны) при reference = none.
[geometry]
kind = "L"
side = 1.0
cut = 0.5

[bc]
type = "soft_hinge"

[load]
type = "uniform"
q0 = 4.0

[model]
theory = "ktn_linear"
h = 0.08

[contact]
enabled = true
gap_factor = 0.002        # МАЛЫЙ зазор ⇒ площадной контакт с плато
beta = 1.2
max_iter = 15000
tol = 1.0e-8

[discretization]
p = 8
Q = 64
grid_n = 32

[verify]
reference = "none"        # эталона нет; гейтуются инварианты контакта

[output]
dir = "results/ci/lshape_ktn_plateau"
