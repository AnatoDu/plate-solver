# CI: преднапряжённая собственная задача из case-файла (v0.6.6):
# частоты вокруг кармановского состояния N(w) под [load].
# Числовые ворота — tests/test_eigenmodes.py (частота растёт с натяжением).

[geometry]
kind = "rectangle"
x1 = 0.0
x2 = 1.0
y1 = 0.0
y2 = 1.0

[bc]
type = "soft_hinge"

[load]
type = "uniform"
q0 = 200.0

[model]
theory = "karman"
h = 0.05

[eigen]
kind = "vibration"
n_modes = 3
prestress = true

[discretization]
p = 8
Q = 48
grid_n = 24

[verify]
reference = "none"
