# CI: эллипс, ШАРНИРНОЕ опирание, изгиб по ПОЛНОЙ КТН (v0.6.3).
# Мягкий шарнир для полной КТН: граничный член слабой формы §3.5 (звёздная
# квадратура ∂Ω). Верификация граничного члена — tests/test_soft_hinge_ktn.py
# (дискретное тождество Грина, редукции, сходимость по p).
[geometry]
kind = "ellipse"
a = 1.5
b = 1.0

[bc]
type = "soft_hinge"

[load]
type = "uniform"
q0 = 0.01

[model]
theory = "ktn_full"
h = 0.2
n_load_steps = 3
karman_max_iter = 100
karman_tol = 1.0e-6

[discretization]
p = 8
Q = 64
grid_n = 16

[verify]
reference = "none"        # независимого эталона КТН нет (как и для защемления)

[output]
dir = "results/ci/ellipse_soft_hinge_ktn_full"
