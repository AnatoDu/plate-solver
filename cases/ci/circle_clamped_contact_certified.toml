# CI: контакт ЗАЩЕМЛЁННОГО круга с плоским основанием — АБСОЛЮТНЫЙ эталон (v0.6.4).
# Сертифицированное осесимметричное решение Кирхгофа (analytic_auto.
# axisym_contact_solution, bc="clamped"): центральная плоская зона + кольцевая
# реакция, кромка w(a)=w'(a)=0. Гейт — прогиб ВНЕ контактной зоны. Защемлённый
# круг ЖЁСТЧЕ шарнирного (w_free(0)=q0 a^4/64D), поэтому зазор меньше.
[geometry]
kind = "circle"
a = 1.0

[bc]
type = "clamped"

[load]
type = "uniform"
q0 = 4.0

[model]
theory = "classic"
h = 0.06

[contact]
enabled = true
gap = 0.7e-3             # 0 < Δ < w_free(0) = 1.50e-3 (защемление)
max_iter = 2000
tol = 1.0e-8

[discretization]
p = 8
Q = 128
grid_n = 16

[verify]
reference = "analytic"  # сертифицированный контактный эталон Кирхгофа (защемление)
tol = 2.0e-2

[output]
dir = "results/ci/circle_clamped_contact_certified"
