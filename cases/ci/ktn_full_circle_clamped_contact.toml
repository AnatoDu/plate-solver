# CI: нелинейный контакт МОР+полная КТН, круг, защемление (v0.6.3).
# Контакт «щупает» ЛИЦЕВУЮ поверхность (условие Синьорини на грани,
# u_c = w + (h_c²−h_*²)Δw): подпись КТН — сглаживание реакции сдвигом/обжатием.
[geometry]
kind = "circle"
a = 1.0

[bc]
type = "clamped"

[load]
type = "uniform"
q0 = 0.01                 # малая нагрузка ⇒ МОР сходится быстро

[model]
theory = "ktn_full"
h = 0.2
n_load_steps = 3
karman_max_iter = 100
karman_tol = 1.0e-6

[contact]
enabled = true
gap_factor = 0.5          # Δ = 0.5·w_free — частичная зона контакта
scheme = "merged"         # совмещённая схема (§4.2)
gain = "secant"
beta = 1.5
max_iter = 3000
tol = 3.0e-4

[discretization]
p = 8
Q = 64
grid_n = 16

[verify]
reference = "none"        # ворота-инварианты (r≥0, комплементарность, зона)

[output]
dir = "results/ci/ktn_full_circle_clamped_contact"
