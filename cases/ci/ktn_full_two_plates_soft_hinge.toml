# CI: нелинейная пара пластин МОР+КТН на МЯГКОМ ШАРНИРЕ (v0.6.5, снят задел v0.7).
# Обе пластины — полная КТН, кромка soft_hinge (граничный член §3.5 у каждой);
# область звёздная (круг). Условие непроникания на ЛИЦЕВЫХ прогибах u_c1−u_c2 ≤ z.
# Ускорение Андерсона внешнего цикла МОР (mor_anderson) — совмещённая схема капризна.
[geometry]
kind = "circle"
a = 1.0

[bc]
type = "soft_hinge"

[load]
type = "uniform"
q0 = 0.01

[model]
theory = "ktn_full"
h = 0.2
n_load_steps = 2
karman_max_iter = 80
karman_tol = 1.0e-6
karman_relax = 0.7

[contact]
enabled = true
target = "plate2"
gap = 0.0                 # касание срединных (лицевые расходятся по КТН)
scheme = "merged"
beta = 1.5
max_iter = 3000
tol = 3.0e-4
mor_anderson = 5          # проекц. Андерсон внешнего цикла (совмещённая схема)

[plate2]
[plate2.bc]
type = "soft_hinge"
[plate2.load]
type = "uniform"
q0 = 0.0                  # нижняя пластина без собственной нагрузки
[plate2.model]
theory = "ktn_full"

[discretization]
p = 8
Q = 64
grid_n = 16

[verify]
reference = "none"        # ворота-инварианты пары (r≥0, комплементарность)

[output]
dir = "results/ci/ktn_full_two_plates_soft_hinge"
