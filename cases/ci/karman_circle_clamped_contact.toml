# CI: нелинейный контакт МОР+Карман, круг, защемление (v0.6.3).
# Геометрически-нелинейный изгиб под односторонним контактом об основание;
# коэффициент лицевой кривизны у Кармана нулевой ⇒ контакт по срединной.
[geometry]
kind = "circle"
a = 1.0

[bc]
type = "clamped"

[load]
type = "uniform"
q0 = 0.01                 # малая нагрузка ⇒ МОР сходится быстро (ворота-инварианты)

[model]
theory = "karman"
h = 0.2
n_load_steps = 3
karman_max_iter = 100
karman_tol = 1.0e-6

[contact]
enabled = true
gap_factor = 0.5          # Δ = 0.5·w_free — частичная зона контакта
scheme = "merged"         # совмещённая схема МОР+Пикар (§4.2)
gain = "secant"           # нормировка усиления оператора (§4.1)
beta = 1.5
max_iter = 3000
tol = 3.0e-4

[discretization]
p = 8
Q = 64
grid_n = 16

[verify]
reference = "none"        # литературных эталонов контакта нет — ворота-инварианты

[output]
dir = "results/ci/karman_circle_clamped_contact"
